name: nodesource-drift

# Tripwire for the vendored NodeSource setup script: weekly (and on-demand) we
# re-fetch the upstream script and compare it to our sha256 pin. A red run here
# means NodeSource changed the script — re-vendor agent_reach/scripts/
# nodesource_setup_22.x.sh, review the diff, and bump _NODESOURCE_SETUP_SHA256.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .

      - name: Compare vendored NodeSource script to upstream
        run: |
          agent-reach verify-node-script
